<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>너를 위해 준비한 이벤트</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

/* ⭐ 배경 레이어 */
.background {
    position: fixed;
    width: 100%;
    height: 100%;
    background-image: url('222.jpg');
    background-size: cover;
    background-position: center;
    z-index: -2;
    transition: 0.5s;
}

/* ⭐ 핑크코랄 10% 오버레이 */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 182, 193, 0.1);
    z-index: -1;
}

/* 가운데 박스 */
.container {
    position: relative;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background-color: rgba(255,255,255,0.85);
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
    line-height: 1.6;
    margin-bottom: 40px;
}

button {
    padding: 12px 28px;
    font-size: 18px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.3s;
}

#yesBtn {
    background-color: #ff7eb9;
    color: white;
}

#yesBtn:hover {
    transform: scale(1.05);
}

#noBtn {
    background-color: #cccccc;
    position: relative;
}
</style>
</head>

<body>

<div class="background" id="bg"></div>
<div class="overlay"></div>

<div class="container">
    <h1 id="text">
        너는야! <br>
        큐티뽀쨕 귀염둥이 아가야!!
    </h1>

    <button id="yesBtn" onclick="yesClick()">Yes</button>
    <button id="noBtn" onmouseover="moveButton()">No</button>
</div>

<script>
function yesClick() {
    document.getElementById("bg").style.backgroundImage = "url('111.jpg')";
    document.getElementById("text").innerHTML =
        "아구 이쁜 아가 많이 사랑해ㅐ";
}

function moveButton() {
    const button = document.getElementById("noBtn");
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 200 - 100;

    button.style.left = x + "px";
    button.style.top = y + "px";
}
</script>

</body>
</html>
