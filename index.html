<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>너를 위해 준비한 이벤트</title>

<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    font-family: 'Gowun Dodum', sans-serif;
    overflow: hidden;
}

/* 배경 */
.background {
    position: fixed;
    width: 100%;
    height: 100%;
    background-image: url('111.jpg');
    background-size: cover;
    background-position: center;
    z-index: -2;
    transition: 0.5s;
}

/* 오버레이 */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background-color: rgba(255,182,193,0.08);
    z-index: -1;
}

/* 중앙 */
.container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

/* 멘트 박스 */
.message-box {
    background: rgba(255,192,203,0.15);
    border: 3px solid #ff8fb1;
    border-radius: 20px;
    padding: 20px 25px 25px 25px;
    font-size: 20px;
    text-align: center;
}

/* 버튼 감싸는 영역 = 이동 제한 구역 */
.button-wrap {
    position: relative;   /* ⭐ 기준점 */
    margin-top: 18px;
    height: 60px;         /* 버튼이 움직일 공간 확보 */
}

/* 버튼 공통 */
button {
    width: 140px;
    height: 42px;
    font-size: 15px;
    border-radius: 20px;
    cursor: pointer;
    border-width: 2px;
    transition: 0.2s ease;
}

/* Yes */
#yesBtn {
    background-color: #ffd1dc;
    border: 2px solid #ff69b4;
    position: absolute;
    left: 0;
}

/* No */
#noBtn {
    background-color: #cde7ff;
    border: 2px solid #4a90e2;
    position: absolute;
    right: 0;
}
</style>
</head>

<body>

<div class="background" id="bg"></div>
<div class="overlay"></div>

<div class="container">
    <div class="message-box" id="text">
        너는야! <br>
        큐티뽀쨕 귀염둥이 아가야!!

        <div class="button-wrap">
            <button id="yesBtn" onclick="yesClick()">웅 나는 아가얌</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">난 테토남이다</button>
        </div>
    </div>
</div>

<script>
let moveCount = 0;

function yesClick() {
    document.getElementById("bg").style.backgroundImage = "url('111.jpg')";
    document.getElementById("text").innerHTML =
        "아구 이쁜 아가 많이 사랑해ㅐ 💖";
}

function moveButton() {
    const area = document.querySelector(".button-wrap");
    const button = document.getElementById("noBtn");

    moveCount++;

    const areaWidth = area.clientWidth;
    const areaHeight = area.clientHeight;

    const btnWidth = button.offsetWidth;
    const btnHeight = button.offsetHeight;

    const maxX = areaWidth - btnWidth;
    const maxY = areaHeight - btnHeight;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    button.style.left = x + "px";
